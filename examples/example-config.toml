# Example configuration for wrangler.toml
# This shows various configuration patterns

name = "ai-worker-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-15"

# Cloudflare AI binding (optional, only needed for cloudflare-ai provider)
[ai]
binding = "AI"

[vars]
# Proxy authentication token (prefer a Cloudflare secret over a plain var)
PROXY_AUTH_TOKEN = "your-secret-proxy-token-here"

# Model routing does NOT live here any more: it lives in routes.json at the repo root,
# which is bundled into the Worker script and therefore has no size limit. A ROUTES_CONFIG
# var would be capped at 5.1 kB and would silently shadow routes.json, so do not add one
# unless you really want to override the bundled file.
#
# Example routes.json (see also the repo root file, and PRIVATE_CONFIG.md for deploying it
# from the ROUTES_CONFIG / ROUTES_CONFIG_2 ... _9 GitHub variables):
#
# {
#   "deep-think": [
#     { "provider": "anthropic", "model": "claude-opus-4-20250514",
#       "apiKeys": ["ANTHROPIC_KEY_1", "ANTHROPIC_KEY_2"] },
#     { "provider": "google", "model": "gemini-2.0-flash-thinking-exp-01-21",
#       "apiKeys": ["GOOGLE_KEY_1"] }
#   ],
#   "fast": [
#     { "provider": "google", "model": "gemini-2.0-flash-exp", "apiKeys": ["GOOGLE_KEY_1"] },
#     { "provider": "cloudflare-ai", "model": "@cf/meta/llama-3.1-8b-instruct", "apiKeys": [] }
#   ],
#   "nvidia": [
#     { "provider": "openai-compatible", "baseUrl": "https://integrate.api.nvidia.com/v1",
#       "model": "nvidia/llama-3.1-nemotron-70b-instruct",
#       "apiKeys": ["NVIDIA_KEY_1", "NVIDIA_KEY_2"] }
#   ],
#   "groq": [
#     { "provider": "openai-compatible", "baseUrl": "https://api.groq.com/openai/v1",
#       "model": "llama-3.3-70b-versatile", "apiKeys": ["GROQ_KEY_1"] }
#   ]
# }

# Supported provider types:
# - anthropic:        Anthropic official API
# - anthropic-compatible: Third-party Anthropic-compatible API (requires baseUrl)
# - google:           Google Gemini API
# - openai:           OpenAI official API
# - openai-compatible: Third-party OpenAI-compatible API (requires baseUrl)
# - cloudflare-ai:    Cloudflare Workers AI binding
#
# Remember to set secrets with:
# wrangler secret put ANTHROPIC_KEY_1
# wrangler secret put GOOGLE_KEY_1
# wrangler secret put OPENAI_KEY_1
# wrangler secret put NVIDIA_KEY_1
# wrangler secret put TOGETHER_KEY_1
# wrangler secret put GROQ_KEY_1
# etc.
