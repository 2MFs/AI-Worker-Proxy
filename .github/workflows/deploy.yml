name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run type check
        run: pnpm run type-check

      - name: Format code
        run: pnpm exec prettier --write "src/**/*.ts"

      - name: Commit and push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "style: auto-format with prettier [skip ci]"
          git push

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The routing table is bundled into the Worker as routes.json instead of being
      # passed as a text binding (Cloudflare caps those at 5.1 kB). One repository
      # variable holds at most 48 kB, so the config may be pasted in parts:
      # ROUTES_CONFIG, ROUTES_CONFIG_2 ... ROUTES_CONFIG_9 are concatenated in order.
      # If none of them is set, the routes.json committed in the repo is used as is.
      - name: Build routes.json from repository variables
        env:
          ROUTES_CONFIG: ${{ vars.ROUTES_CONFIG }}
          ROUTES_CONFIG_2: ${{ vars.ROUTES_CONFIG_2 }}
          ROUTES_CONFIG_3: ${{ vars.ROUTES_CONFIG_3 }}
          ROUTES_CONFIG_4: ${{ vars.ROUTES_CONFIG_4 }}
          ROUTES_CONFIG_5: ${{ vars.ROUTES_CONFIG_5 }}
          ROUTES_CONFIG_6: ${{ vars.ROUTES_CONFIG_6 }}
          ROUTES_CONFIG_7: ${{ vars.ROUTES_CONFIG_7 }}
          ROUTES_CONFIG_8: ${{ vars.ROUTES_CONFIG_8 }}
          ROUTES_CONFIG_9: ${{ vars.ROUTES_CONFIG_9 }}
        run: |
          set -euo pipefail
          CONFIG=""
          for suffix in "" _2 _3 _4 _5 _6 _7 _8 _9; do
            name="ROUTES_CONFIG${suffix}"
            CONFIG="${CONFIG}${!name:-}"
          done
          if [ -z "$(printf '%s' "$CONFIG" | tr -d '[:space:]')" ]; then
            echo "No ROUTES_CONFIG* repository variable set — keeping the committed routes.json"
            exit 0
          fi
          if ! printf '%s' "$CONFIG" | jq . > routes.json.tmp; then
            echo "::error::ROUTES_CONFIG(_2.._9) do not concatenate into valid JSON. Check the split points — the parts are joined verbatim, in order."
            exit 1
          fi
          mv routes.json.tmp routes.json
          echo "routes.json: $(wc -c < routes.json) bytes, $(jq 'length' routes.json) routes"

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets (Settings -> Secrets and variables -> Actions -> Secrets)."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
